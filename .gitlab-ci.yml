# engkit 流水线：**双轨门禁**
#   1. base-gate：基础门禁直跑（pytest + 覆盖率 100% + ruff + pyright），**不依赖 engkit 自身**——
#      引擎出问题时它仍能给出真实结果；
#   2. self-host-smoke：自举烟雾（`engkit preflight --fast` 跑本仓 engkit.toml 声明的静态步骤），
#      验证「换个仓仍可用」，失败即阻断（不设 allow_failure）。

workflow:
  rules:
    # 触发口径（2026-10-26 用户拍板，与 bms / mdm 同口径）：**推送不触发流水线**——日常验证以推送前的
    # 本地预检（`engkit preflight`）为准，CI 只作按需的全量验证，**手工触发即全量**（GitLab 界面
    # Run pipeline 或 `POST /projects/<id>/pipeline`）。因此推送**无需**再加 `-o ci.skip`。
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

stages:
  - lint
  - test

default:
  # 与 bms / mdm 共用同一台实例 runner（标签 bms / mdm）
  tags: [bms]
  image: python:3.14-slim
  interruptible: true

variables:
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_LINK_MODE: copy

.setup: &setup
  # pyright 经 pyright-python 拉 node 运行，`python:3.14-slim` 缺 `libatomic.so.1` 会导致 node 启动失败
  # （2026-10-28 实测：`libatomic.so.1: cannot open shared object file`，exit 127）；apt 走清华镜像
  - sed -i 's|deb.debian.org|mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/debian.sources
  - apt-get update && apt-get install -y --no-install-recommends libatomic1
  - pip install --no-cache-dir uv
  - uv sync --frozen

base-gate:
  stage: lint
  script:
    - *setup
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pyright
    - uv run pytest --cov=src/engkit --cov-branch --cov-fail-under=100
  coverage: '/^TOTAL.*?\s+(\d+(?:\.\d+)?%)$/'

self-host-smoke:
  stage: test
  script:
    - *setup
    - uv run engkit preflight --fast --jobs off
  needs: []
