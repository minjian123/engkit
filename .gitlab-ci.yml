# engkit 流水线：**双轨门禁**
#   1. base-gate：基础门禁直跑（pytest + 覆盖率 100% + ruff + pyright），**不依赖 engkit 自身**——
#      引擎出问题时它仍能给出真实结果；
#   2. self-host-smoke：自举烟雾（`engkit preflight --fast` 跑本仓 engkit.toml 声明的静态步骤），
#      验证「换个仓仍可用」，失败即阻断（不设 allow_failure）。

workflow:
  rules:
    # 触发口径（2026-10-26 用户拍板，与 bms / mdm 同口径）：**推送不触发流水线**——日常验证以推送前的
    # 本地预检（`engkit preflight`）为准，CI 只作按需的全量验证，**手工触发即全量**（GitLab 界面
    # Run pipeline 或 `POST /projects/<id>/pipeline`）。因此推送**无需**再加 `-o ci.skip`。
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

stages:
  - lint
  - test

default:
  # 与 bms / mdm 共用同一台实例 runner（标签 bms / mdm）
  tags: [bms]
  # **与 bms 同一 CI 基础镜像**（`bms/deploy/ci/Dockerfile.backend`）：Python 3.14 + uv + git +
  # libatomic1 + Node 22。换掉 `python:3.14-slim` 的直接原因：slim 无 node，pyright-python 会退回
  # nodeenv 现场下载 node，2026-11-05 #1596 实测 nodeenv 解析版本串崩溃
  # （`ValueError: invalid literal for int(): '0-alpha'`）；镜像自带 node 后 pyright 直接命中系统 node。
  image: $REGISTRY_IMAGE_PREFIX/ci-backend:py314
  interruptible: true

variables:
  # 与 bms 同口径（bms/.gitlab-ci.yml 的 variables）：CI 基础镜像仓库前缀
  REGISTRY_IMAGE_PREFIX: 192.168.0.107:5050/bms/bms
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
  UV_LINK_MODE: copy
  # 镜像内置 `UV_PROJECT_ENVIRONMENT=/opt/bms-venv`（bms 专用路径）：本仓显式落回自己的 .venv
  UV_PROJECT_ENVIRONMENT: $CI_PROJECT_DIR/.venv

.setup: &setup
  # 镜像已固化 git / libatomic1 / Node 22 / uv（见 `bms/deploy/ci/Dockerfile.backend`），
  # 故不再 apt 装包、不再 pip 装 uv；git 是 eol / gitutil / selection 等用例与行尾检查的前提
  - uv sync --frozen

base-gate:
  stage: lint
  script:
    - *setup
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pyright
    - uv run pytest --cov=src/engkit --cov-branch --cov-fail-under=100
  coverage: '/^TOTAL.*?\s+(\d+(?:\.\d+)?%)$/'

self-host-smoke:
  stage: test
  script:
    - *setup
    # 自举烟雾要跑 uv sync（首次装依赖）+ pyright + 预检全链路，300s 单步预算偏紧（2026-10-28 #1278
    # 实测超时中止）；放宽单步 / 总体预算只在 CI 侧放，不改引擎默认值。node 由基础镜像自带，不再现装
    - uv run engkit preflight --fast --jobs off --step-seconds 900 --budget-seconds 1200
  needs: []
