[project]
name = "engkit"
version = "0.1.0"
description = "跨仓工程化工具包：文档链接与口径护栏、预检与重命令包装、用例登记"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# 唯一的三方运行期依赖：并行档位（`-n`）由 pytest-xdist 提供，随本包安装——各接入仓无需再自行声明
# 该测试插件（口径见《工具包开发约定》§2）。缺失时并行档位显式降级为串行，不静默失败。
dependencies = ["pytest-xdist>=3.6"]

[project.optional-dependencies]
# 工具链版本基线（13_07）：各接入仓以 `engkit[devtools]` 的 git 源依赖取得 ruff / pyright，
# 版本只在本处升级（升级 = 改这里 + 各仓改 rev）；下限口径 + 各仓锁文件固化，避免回退到诊断有差异的旧版
devtools = ["ruff>=0.17.1", "pyright>=1.1.414"]

[project.scripts]
engkit = "engkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    # 工具版本走 devtools 组（本仓以自引用取得，版本仍在 optional-dependencies 一处声明）
    "engkit[devtools]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engkit"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
# 规则段（行宽 / 规则集 / 忽略项）的**唯一来源**是本仓 `toolchain/ruff-base.toml`（13_07）：
# 各接入仓同样 extend 它，故本仓也不在此重复声明规则；本仓专属的只有 target-version（包声明 >=3.11）
extend = "toolchain/ruff-base.toml"
target-version = "py311"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# 类型门禁范围 = 包源码（`src/`）：用例以 pytest + ruff 把关，不重复要求夹具批注
include = ["src"]
extraPaths = ["src"]
reportMissingTypeStubs = false
# 配置解析（tomllib）、覆盖率报告（JSON）与远端回读是动态结构，边界处保留 `Any`：
# 仅关闭「未知类型」四项，其余严格项（含未使用忽略、私有访问等）保持开启
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --basetemp=.cache/pytest"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
]

[tool.coverage.run]
branch = true
source = ["engkit"]
# 采集数据落点：仓内缓存目录（`.cache/` 已忽略），不落仓库根（2026-10-26 拍板）
# 与 engkit.toml 的 `[coverage].data_file` 同口径：前者管裸跑 `pytest --cov`（pytest-cov 只读本文件），
# 后者管经 engkit 包装的入口（`engkit coverage` / `run-selected`）。
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
show_missing = true
