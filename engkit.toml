# engkit 仓自身配置（自举烟雾 job 使用；正式门禁由 CI 直跑 pytest / ruff / pyright）
# 口径：包内不含任何仓名与目录字面，仓结构一律由本文件声明（见 engkit文档/概述/工程化工具包说明.md）。

[repo]
name = "engkit"

[docs]
root = "engkit文档"

[docs.scope]
whitelist_dirs = ["规范/", "概述/", "资料/"]

[pytest]
cmd = "uv run pytest"
cwd = "."

[coverage]
fail_under = 100
plugin = ""
# 采集数据落点：仓内缓存目录（`.cache/` 已忽略），不落仓库根（2026-10-25 拍板）
data_file = ".cache/coverage/.coverage"

[preflight]
# 自举烟雾：只跑静态与工具链自检（用例与覆盖率由 base-gate 直跑，不在此重复）
steps = [
  { label = "行尾：工作树 CRLF 检查", cmd = ["uv", "run", "engkit", "eol", "--quiet"] },
  { label = "静态：ruff check", cmd = ["uv", "run", "ruff", "check", "."] },
  { label = "静态：ruff format --check", cmd = ["uv", "run", "ruff", "format", "--check", "."] },
  { label = "静态：pyright", cmd = ["uv", "run", "pyright", "--outputjson"] },
]

[guard]
scripts = []
repo_dirs = ["src", "tests"]
dir_test_threshold = 20

[kiwi]
env_file = "deploy/.env"
host_env = "MJBK_IP"
user_env = "MJBK_SSH_USER"
container = "bms-kiwi"

[toolchain]
# ruff 规则基线（相对仓根）：各接入仓以 `extend` 指向本文件，规则段不再复制（13_07）
baseline = "toolchain/ruff-base.toml"
# 需校验「只 extend、不复制规则段」的仓配置（相对仓根；平级仓以 `../` 表示）。
# 路径不存在即跳过——CI 只 clone 本仓时不误判；本地工作区各仓并置时逐个受检。
ruff_configs = [
  "pyproject.toml",
  "../bms/backend/pyproject.toml",
  "../mdm/backend/pyproject.toml",
]
