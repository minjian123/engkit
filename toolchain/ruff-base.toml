# ruff 规则基线（跨仓单一来源）——`13_07` 工具链基线与版本统一
#
# 口径（见《工程化工具包说明》§5「工具链基线」）：
#   1. 各接入仓 `pyproject.toml` 以 `extend = "<相对路径>/toolchain/ruff-base.toml"` 引用本文件，
#      相对路径按**声明它的配置文件所在目录**解析（ruff 实测口径，不展开环境变量）；
#   2. 本文件只放各仓**完全一致**的部分（行宽 / 规则集 / 忽略项）；
#   3. **本仓专属项不得写入**：`target-version`（各仓 Python 版本不同）、`known-first-party` /
#      `src`（本仓包结构）、`extend-exclude` / `per-file-ignores`（本仓路径）一律留在各仓配置里；
#   4. 基线缺失时 ruff **直接报错退出码 2**（不静默回落到旧规则），故各仓必须有 engkit 克隆——
#      这是有意为之，仓内**不得**留存基线副本（副本即第二份实现）。
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文标点为文档与注释的有意用法，关闭歧义字符检查
ignore = ["RUF001", "RUF002", "RUF003"]
